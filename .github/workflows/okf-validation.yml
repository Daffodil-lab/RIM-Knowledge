name: OKF validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Regenerate and validate OKF
        shell: bash
        run: |
          set -euo pipefail
          node knowledge/tools/maintain-okf.mjs --write

      - name: Reject uncommitted generated changes
        shell: bash
        run: git diff --exit-code -- .
